name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    ci:
        name: Lint + Format + Spell Check + Compile + Test
        runs-on: ubuntu-latest
        timeout-minutes: 15
        # tests/'s file: dependencies on both packages (see architecture.md) mean every mise/npm
        # command below needs to run from inside surge/, not $GITHUB_WORKSPACE itself.
        defaults:
            run:
                working-directory: surge
        steps:
            - name: Checkout surge
              uses: actions/checkout@v7
              with:
                  path: surge

            # The transformer's commit this repository is tested against, recorded in
            # ci/transformer-ref and bumped deliberately (see testing.md), so that a run is
            # reproducible and a push to the transformer alone cannot change its result.
            - name: Read the pinned rbxts-transformer-surge commit
              id: transformer
              run: echo "ref=$(tr -d '[:space:]' < ci/transformer-ref)" >> "$GITHUB_OUTPUT"

            # A sibling checkout, not a submodule: tests/package.json's
            # `"rbxts-transformer-surge": "file:../../rbxts-transformer-surge"` (see architecture.md)
            # resolves relative to surge/tests/, exactly matching local sibling-checkout dev.
            - name: Checkout rbxts-transformer-surge
              uses: actions/checkout@v7
              with:
                  repository: travddm/rbxts-transformer-surge
                  ref: ${{ steps.transformer.outputs.ref }}
                  path: rbxts-transformer-surge

            # npm's download cache, not node_modules: `npm ci` removes node_modules before it
            # installs. Keyed on the exact lockfiles, with no fallback to another key's cache.
            - name: Cache npm downloads
              uses: actions/cache@v6
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-npm-${{ hashFiles('surge/package-lock.json', 'surge/tests/package-lock.json', 'rbxts-transformer-surge/package-lock.json') }}

            - name: Set up mise
              uses: jdx/mise-action@v4
              with:
                  install: true
                  cache: true
                  working_directory: surge

            # Each file: dependency's own `prepare` script (which compiles it) runs during the
            # *consumer's* install, so each package needs its own devDependencies in place first
            # -- confirmed by reproducing this exact failure in a from-scratch sibling checkout
            # before adding these two steps (see testing.md). `npm ci` installs what the lockfile
            # records and fails where it does not match package.json.
            - name: Install rbxts-transformer-surge's own dependencies
              working-directory: rbxts-transformer-surge
              run: npm ci

            - name: Install this package's own dependencies
              run: npm ci

            # What `mise run tests:install` does, with `npm ci` in place of `npm install`.
            - name: "Test: install tests/ (needed before lint can resolve its imports)"
              run: node tests/scripts/clear-stale-build.mjs && npm ci --prefix tests

            # mise's postinstall hook runs `npm install`, which can rewrite a lockfile that does
            # not match its package.json; a rewritten one fails here instead of passing unseen.
            - name: "Check: Lockfiles"
              run: git diff --exit-code -- package-lock.json tests/package-lock.json

            - name: "Check: Lint"
              run: mise run lint:check

            - name: "Check: Format"
              run: mise run format:check

            - name: "Check: Spell"
              run: mise run spell

            - name: "Check: Compile"
              run: mise run compile

            - name: "Test: round-trip suite (Lune)"
              run: |
                  mise run tests:compile
                  mise run tests:test

            - name: "Test: golden-Luau invariants"
              run: mise run test
