name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    ci:
        # Both packages at one commit, so a change to either is tested with the other. Windows
        # too, because the maintainer works there and the mise tasks run through Git Bash.
        name: CI (${{ matrix.os }})
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        defaults:
            run:
                # Git Bash on Windows: the mise tasks assume a POSIX shell (see testing.md).
                shell: bash
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # Installs the root's tools (Node) and runs its postinstall hook.
            - name: Set up mise
              uses: jdx/mise-action@v4
              with:
                  install: true
                  cache: true

            # surge's own tools (Rojo, Lune, run-in-roblox, Blink, Zap) are in surge/mise.toml,
            # which `mise install` at the root does not read.
            - name: Install surge's tools
              working-directory: surge
              run: mise install

            # npm's download cache, not node_modules: `npm ci` removes node_modules before it
            # installs. Keyed on every lock file, with no fallback to another key's cache. The
            # directory differs by platform, so npm reports it.
            - name: Find npm's cache
              id: npm-cache
              run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

            - name: Cache npm downloads
              uses: actions/cache@v6
              with:
                  path: ${{ steps.npm-cache.outputs.dir }}
                  key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json', 'rbxts-transformer-surge/package-lock.json', 'surge/package-lock.json', 'surge/tests/package-lock.json') }}

            # `npm ci` installs what each lock file records and fails where one does not match its
            # package.json. The transformer installs before surge: surge's tests/ builds a copy
            # of it with its own devDependencies (see testing.md).
            - name: Install the root's dependencies
              run: npm ci

            - name: Install the transformer's dependencies
              working-directory: rbxts-transformer-surge
              run: npm ci

            - name: Install surge's dependencies
              working-directory: surge
              run: npm ci

            # What `mise run tests:install` does, with `npm ci` in place of `npm install`.
            - name: Install surge's tests/
              working-directory: surge
              run: node tests/scripts/clear-stale-build.mjs && npm ci --prefix tests

            # The postinstall hooks run `npm install`, which can rewrite a lock file that does not
            # match its package.json; a rewritten one fails here instead of passing unseen.
            - name: "Check: Lock files"
              run: git diff --exit-code -- package-lock.json rbxts-transformer-surge/package-lock.json surge/package-lock.json surge/tests/package-lock.json

            - name: "Root: Lint"
              run: npm run lint:check

            - name: "Root: Format"
              run: npm run format:check

            - name: "Root: Spell"
              run: npm run spell

            - name: "Transformer: Lint"
              working-directory: rbxts-transformer-surge
              run: mise run lint:check

            - name: "Transformer: Format"
              working-directory: rbxts-transformer-surge
              run: mise run format:check

            - name: "Transformer: Spell"
              working-directory: rbxts-transformer-surge
              run: mise run spell

            - name: "Transformer: Compile"
              working-directory: rbxts-transformer-surge
              run: mise run compile

            - name: "Transformer: Jest"
              working-directory: rbxts-transformer-surge
              run: mise run test

            - name: "surge: Lint"
              working-directory: surge
              run: mise run lint:check

            - name: "surge: Format"
              working-directory: surge
              run: mise run format:check

            - name: "surge: Spell"
              working-directory: surge
              run: mise run spell

            - name: "surge: Compile"
              working-directory: surge
              run: mise run compile

            - name: "surge: Round-trip suite (Lune)"
              working-directory: surge
              run: |
                  mise run tests:compile
                  mise run tests:test

            - name: "surge: Golden-Luau invariants"
              working-directory: surge
              run: mise run test
