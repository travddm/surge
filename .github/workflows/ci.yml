name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    # Runs the checks on any branch, and with `dev-tag`, tags that branch's commit once they pass.
    workflow_dispatch:
        inputs:
            dev-tag:
                description: Make dev tags of the commit once the checks pass
                type: boolean
                default: false

jobs:
    ci:
        # Both packages at one commit, so a change to either is tested with the other. Windows
        # too: roblox-ts projects are built on Windows or macOS, where the transformer runs inside
        # rbxtsc, and the maintainer runs the mise tasks on Windows through Git Bash.
        name: CI (${{ matrix.os }})
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        defaults:
            run:
                # Git Bash on Windows: the mise tasks assume a POSIX shell (see testing.md).
                shell: bash
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # From surge/, mise reads surge's mise.toml and the root's, so this installs and caches
            # every tool: Node, and surge's Rojo, Lune, run-in-roblox, Blink and Zap.
            - name: Set up mise
              uses: jdx/mise-action@v4
              with:
                  install: true
                  cache: true
                  working_directory: surge

            # npm's download cache, not node_modules: `npm ci` removes node_modules before it
            # installs. Keyed on every lock file, with no fallback to another key's cache. The
            # directory differs by platform, so npm reports it.
            - name: Find npm's cache
              id: npm-cache
              run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

            - name: Cache npm downloads
              uses: actions/cache@v6
              with:
                  path: ${{ steps.npm-cache.outputs.dir }}
                  key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json', 'rbxts-transformer-surge/package-lock.json', 'surge/package-lock.json', 'surge/tests/package-lock.json') }}

            # `npm ci` installs what each lock file records, and fails where one does not match its
            # package.json. Each package's `prepare` compiles it during its install, so a type
            # error in either package fails its install step.
            - name: Install the root's dependencies
              run: npm ci

            - name: Install the transformer's dependencies
              working-directory: rbxts-transformer-surge
              run: npm ci

            - name: Install surge's dependencies
              working-directory: surge
              run: npm ci

            # Prettier's and cspell's records of the files that passed, which `format:check` and
            # `spell` read from each project's node_modules/.cache, so this follows the `npm ci` steps
            # that delete node_modules. Unlike npm's cache, this one falls back to the newest cache
            # with the same lock files: each tool checks a file again when its content, its options or
            # its configuration changes. Neither tool records its plugins' or dictionaries' versions,
            # so the key holds the lock files.
            - name: Cache Prettier and cspell results
              uses: actions/cache@v6
              with:
                  path: |
                      node_modules/.cache/prettier
                      node_modules/.cache/cspell
                      rbxts-transformer-surge/node_modules/.cache/prettier
                      rbxts-transformer-surge/node_modules/.cache/cspell
                      surge/node_modules/.cache/prettier
                      surge/node_modules/.cache/cspell
                  key: ${{ runner.os }}-checks-${{ hashFiles('package-lock.json', 'rbxts-transformer-surge/package-lock.json', 'surge/package-lock.json') }}-${{ github.sha }}
                  restore-keys: ${{ runner.os }}-checks-${{ hashFiles('package-lock.json', 'rbxts-transformer-surge/package-lock.json', 'surge/package-lock.json') }}-

            # The root files' checks, then the transformer's `ci`, then surge's, which installs
            # its tests/ first: the same task a contributor runs, so the two cannot drift apart.
            - name: mise run ci
              run: mise run ci

            # surge's tests/ installs with `npm install`, which rewrites a lock file that does not
            # match its package.json; a rewritten one fails here instead of passing unseen.
            - name: "Check: Lock files"
              run: git diff --exit-code -- '*package-lock.json'

    tag:
        # The one-package tags of a commit whose checks passed on both systems: pre-release tags for
        # each push to master, and dev tags for a run started with `dev-tag`. scripts/tag-packages.mjs
        # says what each tag is. A tag pushed with GITHUB_TOKEN starts no workflow run.
        name: Tag
        needs: ci
        if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && inputs.dev-tag)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            # The whole history and every tag: the script counts commits and reads release tags, and
            # refuses a shallow clone.
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Set up mise
              uses: jdx/mise-action@v4
              with:
                  install: true
                  cache: true

            - name: Tag the packages
              run: node scripts/tag-packages.mjs ${{ github.event_name == 'push' && 'next' || 'dev' }} --push
              env:
                  GIT_AUTHOR_NAME: github-actions[bot]
                  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
                  GIT_COMMITTER_NAME: github-actions[bot]
                  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
